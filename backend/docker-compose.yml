services:
  postgres:
    image: postgres:16-alpine
    container_name: procurehub-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: procurehub
      POSTGRES_USER: procurehub
      POSTGRES_PASSWORD: procurehub_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurehub -d procurehub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
