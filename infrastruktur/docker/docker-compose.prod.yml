services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procurehub
      POSTGRES_USER: procurehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurehub -d procurehub"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/muhammad2341/procurehub-api:main
    ports:
      - "5000:5000"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=procurehub;Username=procurehub;Password=${POSTGRES_PASSWORD}
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - Jwt__Issuer=procurehub-api
      - Jwt__Audience=procurehub-client
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/muhammad2341/procurehub-web:main
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
